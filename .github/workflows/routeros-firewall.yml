name: RouterOS - draft firewall rule
on:
  workflow_dispatch:
    inputs:
      action:
        description: Firewall action
        required: true
        type: choice
        options: [drop, accept]
      protocol:
        description: IP protocol
        required: true
        type: choice
        options: [tcp, udp]
      port:
        description: Destination port (1-65535)
        required: true
        type: string
      source:
        description: Source IPv4 address or CIDR
        required: true
        type: string
permissions:
  contents: read
jobs:
  draft:
    # Use a dedicated Linux runner with this custom label, never a public/shared runner.
    runs-on: [self-hosted, linux, routeros-firewall]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Create disabled rule over SSH
        env:
          INPUT_ACTION: ${{ inputs.action }}
          INPUT_PROTOCOL: ${{ inputs.protocol }}
          INPUT_PORT: ${{ inputs.port }}
          INPUT_SOURCE: ${{ inputs.source }}
          ROUTER_HOST: ${{ secrets.ROUTER_HOST }}
          ROUTER_USER: ${{ secrets.ROUTER_USER }}
          ROUTER_SSH_KEY: ${{ secrets.ROUTER_SSH_KEY }}
          ROUTER_KNOWN_HOSTS: ${{ secrets.ROUTER_KNOWN_HOSTS }}
        run: python3 runner/firewall.py
